<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Seconde Guerre Mondiale — Chronologie 1939–1945</title>
<link rel="stylesheet" href="style.css"/>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <span class="topbar-brand">Chronologie <span>1939 – 1945</span></span>
    <button class="theme-btn" id="theme-btn" aria-label="Basculer mode sombre/clair">
      <svg id="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="16" height="16" style="display:none"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      <svg id="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="16" height="16"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </div>
</div>

<header class="hero">
  <h1 class="hero-title">Seconde<br><em>Guerre Mondiale</em></h1>
  <p class="hero-standfirst">Événements officiels, faits méconnus et anecdotes oubliées — de l'invasion de la Pologne à la capitulation japonaise.</p>
</header>

<nav class="filters-wrap" aria-label="Filtres">
  <div class="filters-inner">
    <span class="filter-label">Filtrer</span>
    <button class="filter-btn active" data-filter="all">Tous</button>
    <button class="filter-btn" data-filter="known">Événement majeur</button>
    <button class="filter-btn" data-filter="rare">Peu connu</button>
    <button class="filter-btn" data-filter="anecdote">Anecdote</button>
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input class="search-input" id="search-input" type="search" placeholder="Rechercher…" aria-label="Rechercher un événement"/>
      <button class="search-clear" id="search-clear" aria-label="Effacer">✕</button>
    </div>
    <span class="event-count" id="event-count"></span>
  </div>
</nav>

<main>
  <div class="timeline-wrap">
    <div class="timeline-spine" aria-hidden="true"></div>
    <div id="timeline-root"></div>
  </div>
</main>

<footer class="site-footer">
  <div class="site-footer-inner">
    <span class="footer-brand">Seconde Guerre Mondiale · 1939–1945</span>
    <span class="footer-meta">Sources : <a href="https://fr.wikipedia.org" target="_blank" rel="noopener">Wikipédia</a> &nbsp;·&nbsp; Données à titre documentaire et éducatif</span>
  </div>
</footer>

<!-- Tes données : remplace ce fichier par ton propre data.js -->
<script src="data.js"></script>
<script src="main.js"></script>
</body>
</html>
